<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GymTracker</title>
  <meta name="description" content="GymTracker: registro de entrenamientos con sobrecarga progresiva por grupo muscular, myo-reps, rest-pause, drop sets y estadísticas.">
  <meta name="theme-color" content="#fcf9f8">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GymTracker">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M4 9v6M7 6.5v11M17 6.5v11M20 9v6M7 12h10"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5.5v13l11-6.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 5-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20v-7M11 20V5M17 20v-10M3 20h18"/></symbol>
    <symbol id="i-trending" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c1 3 4 4.5 4 9a4 4 0 0 1-8 0c0-1.5.6-2.6 1.3-3.4.4 1 1.2 1.6 2.2 1.4C10.5 8 10 5.5 12 3z"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></symbol>

    <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>

    <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14m6-6-6 6-6-6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m-5-5 5 5 5-5M4 20h16"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4m-5 5 5-5 5 5M4 20h16"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v12h14V8M10 12h4"/></symbol>
    <symbol id="i-feather" viewBox="0 0 24 24"><path d="M5 20c0-8 5-13 14-14-1 9-6 14-14 14z"/><path d="M5 20c3-5 6-8 10-11"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-quote" viewBox="0 0 24 24"><path d="M9 7c-2.5 0-4 1.8-4 4s1.4 3.5 3.2 3.5c.4 2-1 3-2.2 3.5 3.8 0 6-3 6-7 0-2.5-1.3-4-3-4z"/><path d="M18 7c-2.5 0-4 1.8-4 4s1.4 3.5 3.2 3.5c.4 2-1 3-2.2 3.5 3.8 0 6-3 6-7 0-2.5-1.3-4-3-4z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><svg class="ic"><use href="#i-dumbbell"/></svg></div>
        <div class="brand-name">GymTracker</div>
      </div>
      <p class="motto hand" data-motto></p>
      <nav class="nav" aria-label="Secciones">
        <a href="#/entreno" data-nav="entreno"><svg class="ic"><use href="#i-play"/></svg><span>Entreno</span></a>
        <a href="#/historial" data-nav="historial"><svg class="ic"><use href="#i-archive"/></svg><span>Historial</span></a>
        <a href="#/rutina" data-nav="rutina"><svg class="ic"><use href="#i-list"/></svg><span>Rutina</span></a>
        <a href="#/progreso" data-nav="progreso"><svg class="ic"><use href="#i-chart"/></svg><span>Progreso</span></a>
        <a href="#/ejercicios" data-nav="ejercicios"><svg class="ic"><use href="#i-dumbbell"/></svg><span>Ejercicios</span></a>
      </nav>
      <div class="sidebar-foot">
        <button class="btn btn-ghost" data-install-shell hidden><svg class="ic"><use href="#i-download"/></svg><span>Instalar app</span></button>
        <a href="#/ajustes" data-nav="ajustes" class="nav-link"><svg class="ic"><use href="#i-settings"/></svg><span>Ajustes</span></a>
        <p class="sidebar-note"><svg class="ic"><use href="#i-flame"/></svg> Una serie más que ayer.</p>
      </div>
    </aside>

    <main id="view" class="view"></main>

    <nav class="tabbar" aria-label="Secciones">
      <a href="#/entreno" data-nav="entreno"><svg class="ic"><use href="#i-play"/></svg><span>Entreno</span></a>
      <a href="#/historial" data-nav="historial"><svg class="ic"><use href="#i-archive"/></svg><span>Historial</span></a>
      <a href="#/rutina" data-nav="rutina"><svg class="ic"><use href="#i-list"/></svg><span>Rutina</span></a>
      <a href="#/progreso" data-nav="progreso"><svg class="ic"><use href="#i-chart"/></svg><span>Progreso</span></a>
      <a href="#/ejercicios" data-nav="ejercicios"><svg class="ic"><use href="#i-dumbbell"/></svg><span>Ejercicios</span></a>
      <a href="#/ajustes" data-nav="ajustes"><svg class="ic"><use href="#i-settings"/></svg><span>Ajustes</span></a>
    </nav>
  </div>

  <div id="modal"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
